<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller semana 10</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Inicio de sesion - Taller 10</h1>
    </header>
    <main>
        <!-- Login -->
        <section class="inicio_sesion" id="seccion_login">
            <h2>Iniciar sesion</h2>
            <form id="form" method="post">
                <label for="texto_usuario">Ingresar nombre de usuario:</label>
                <input type="text" name="usuario" id="texto_usuario" required>

                <label for="texto_contrasena">Ingresar contraseña</label>
                <input type="password" name="contrasena" id="texto_contrasena" required>

                <button type="submit" id="boton_login">Iniciar sesion</button>
                <p id="error"></p>
            </form>
        </section>

        <section class="mostrar_datos oculto" id="seccion_perfil">
            <h2>Mis datos</h2>
            <button type="button" id="boton_logout">Cerrar sesion</button>

            <!-- Perfil -->
            <div id="contenedor_perfil">
                <img id="perfil_foto" alt="Foto de perfil" class="avatar">
                <h3 id="perfil_nombre"></h3>
                <p><strong>Correo:</strong> <span id="perfil_correo"></span> </p>
                <p><strong>Telefono:</strong> <span id="perfil_telefono"></span></p>
                <p><strong>Universidad:</strong> <span id="perfil_universidad"></span></p>
            </div>

            <!-- Tareas-->
            <div id="contenedor_tareas">
                <h2>Mis Tareas</h2>

                <div class="contenedor_metricas">
                    <div class="caja_metrica"><p><strong>Total:</strong></p> <span id="metrica_total">0</span></div>
                    <div class="caja_metrica"><p><strong>Completadas:</strong></p> <span id="metrica_completadas">0</span></div>
                    <div class="caja_metrica"><p><strong>Pendientes:</strong></p> <span id="metrica_pendientes">0</span></div>
                    <div class="caja_metrica"><p><strong>Avance:</strong></p> <span id="metrica_avance">0%</span></div>
                </div>

                <div>
                    <!-- Agregar tarea-->
                    <form id="form_agregar_tarea">
                        <label for="campo_nueva_tarea">Escribe una nueva tarea: </label>
                        <input type="text" id="campo_nueva_tarea">
                        <button type="submit" id="boton_agregar_tarea">Agregar tarea</button>
                    </form>

                    <label for="buscador_tarea">Buscador de tarea</label>
                    <input id="buscador_tarea" type="text" placeholder="Buscar por texto...">
                    <div id="filtros_contenedor">
                        <button type="button" class="boton_filtro activo" data-filtro="todas">Todas</button>
                        <button type="button" class="boton_filtro" data-filtro="pendientes">Pendientes</button>
                        <button type="button" class="boton_filtro" data-filtro="completadas">Completadas</button>
                    </div>
                </div>

                <!-- Lista tareas-->
                <ul id="lista_tareas">

                </ul>

            </div>

        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
